apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantdesk
  labels:
    app.kubernetes.io/name: quantdesk
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: quantdesk
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quantdesk
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: engine
          image: quantdesk/engine:1.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: quantdesk-config
          ports:
            - containerPort: 9090
              name: metrics
          resources:
            limits:
              cpu: "2"
              memory: "1Gi"
            requests:
              cpu: "1"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9090
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: wal-storage
              mountPath: /data/wal

        - name: bridge
          image: quantdesk/bridge:1.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: quantdesk-config
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8765
              name: websocket
          resources:
            limits:
              cpu: "1"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5

      volumes:
        - name: wal-storage
          emptyDir: {}
