apiVersion: v1
kind: Service
metadata:
  name: quantdesk-service
  labels:
    app.kubernetes.io/name: quantdesk
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: quantdesk
  ports:
    - name: http-ui
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: websocket
      port: 8765
      targetPort: 8765
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
