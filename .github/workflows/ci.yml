name: QuantDesk Production CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  cpp-build-and-test:
    name: C++20 Build & Test (${{ matrix.os }} - ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        compiler: [gcc, clang]
        exclude:
          - os: windows-latest
            compiler: clang

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Linux Compiler
        if: runner.os == 'Linux' && matrix.compiler == 'gcc'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-12 cmake ninja-build
          echo "CXX=g++-12" >> $GITHUB_ENV
          echo "CC=gcc-12" >> $GITHUB_ENV

      - name: Set up Linux Clang
        if: runner.os == 'Linux' && matrix.compiler == 'clang'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-15 cmake ninja-build
          echo "CXX=clang++-15" >> $GITHUB_ENV
          echo "CC=clang-15" >> $GITHUB_ENV

      - name: Configure CMake (Release)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ Targets
        run: cmake --build build --config Release

      - name: Run CTest Suite (8 Test Suites)
        run: ctest --test-dir build --output-on-failure --verbose

  sanitizer-suite:
    name: Memory & Concurrency Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-12 cmake ninja-build

      - name: Configure CMake with AddressSanitizer & UBSan
        run: |
          cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON -DCMAKE_CXX_COMPILER=g++-12

      - name: Build with Sanitizers
        run: cmake --build build-asan

      - name: Run Sanitized Unit & Property Tests
        run: ctest --test-dir build-asan --output-on-failure

  python-bridge-tests:
    name: Python WebSocket Bridge Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest websockets

      - name: Run PyTest Suite
        run: pytest tests/test_bridge.py -v

  static-analysis:
    name: Static Analysis & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Clang-Tidy & Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy cppcheck

      - name: Run Cppcheck Analysis
        run: |
          cppcheck --enable=warning,performance,portability --error-exitcode=1 --inline-suppr -I include/ include/ src/
